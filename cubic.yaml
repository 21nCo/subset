# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
# Hosted cubic review settings. cubic bills per reviewed line, so this skips
# files whose review adds little. Code (including test code and test helpers),
# agent instructions, prompts, skills, specs, contracts and docs that define
# behaviour stay reviewed.
version: 1

reviews:
  ignore:
    files:
      # Prose documentation. The local review runs a docs-vs-code check (cubic
      # CLI) before the PR opens and on every fix push.
      - '**/CHANGELOG.md'
      - '**/CONTRIBUTING.md'
      # Recorded or generated test data (hand-written contract cases and helper code stay reviewed)
      - 'packages/timer/fixtures/**'
      - 'scripts/fixtures/**'
      - 'packages/bookmarks-core/test/fixtures/**/*.html'
      - 'packages/bookmarks-core/test/fixtures/**/*.json'
      - 'packages/bookmarks-core/test/fixtures/**/*.csv'
      - 'packages/links/test/fixtures/**/*.html'
      - 'packages/links/test/fixtures/**/*.json'
      - 'packages/links/test/fixtures/**/*.csv'
      # Test snapshots (snapshot folders holding reviewed contract JSON stay reviewed)
      - '**/*.snap'
      # Generated output
      - '**/dist/**'
      - '**/generated/**'
      - '**/*.generated.*'
      # Lockfiles. The local review checks new dependency advisories with osv-scanner.
      - 'pnpm-lock.yaml'
      - '**/pnpm-lock.yaml'
      - 'package-lock.json'
      - '**/package-lock.json'
      - 'yarn.lock'
      - '**/yarn.lock'
      - 'bun.lock'
      - '**/bun.lock'
      - 'Cargo.lock'
      - '**/Cargo.lock'
      - '**/Package.resolved'
      - '.github/**/package-lock.json'
      - '.github/**/pnpm-lock.yaml'
