name: Promote

# Changes reach main only from dev: feature branches merge into dev, where they get beta builds, and a pull
# request from dev promotes them to main. The main branch ruleset requires this check.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Pull requests into main must come from $GITHUB_REPOSITORY's dev branch, not $HEAD_REPO:$HEAD_REF. Target dev instead." >&2
            exit 1
          fi
