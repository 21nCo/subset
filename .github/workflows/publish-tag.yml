name: Publish tagged package

# Push a tag like usage-v0.1.0 (slug from release-packages.json, version matching the
# package.json) to build, test, and publish that one package to npm.
#
# A beta tag like usage-v0.2.0-beta.3 (package.json at 0.2.0) publishes 0.2.0-beta.3 under the `beta`
# dist-tag, so `npx @subset.dev/usage@beta` installs it and the default install is unchanged. beta-builds.yml
# creates these tags and starts this workflow on merges to dev.
on:
  push:
    tags:
      - '*-v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in the form <package-slug>-v<version>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      # A manual run builds the requested tag, never the branch it was dispatched from.
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          # Later steps run code from the tag; they need no authenticated git, so keep the token out of git config.
          persist-credentials: false

      - name: Verify checkout matches the tag
        run: |
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "HEAD ${head_commit} is not tag ${RELEASE_TAG} (${tag_commit})." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Resolve publish target
        id: resolve
        run: node ./scripts/resolve-release-tag.mjs "${RELEASE_TAG}"

      # Published packages bundle private workspaces (for example the CLI bundles
      # @subset/usage and the built dashboard), so install and build from the root.
      - name: Install workspace dependencies
        # No dependency needs an install script on Linux (only macOS's optional fsevents has one).
        run: npm ci --ignore-scripts

      - name: Check workspaces
        run: npm run check

      - name: Build workspaces
        run: npm run build

      - name: Test package
        run: npm test --workspace=${{ steps.resolve.outputs.pkg_name }}

      # A beta must come before its live release, and npm would make a package's first version `latest`.
      - name: Check the beta's version is unreleased
        if: steps.resolve.outputs.npm_tag == 'beta'
        env:
          PKG_NAME: ${{ steps.resolve.outputs.pkg_name }}
          PKG_VERSION: ${{ steps.resolve.outputs.pkg_version }}
        run: |
          if [ -z "$(npm view "$PKG_NAME" dist-tags.latest 2>/dev/null)" ]; then
            echo "$PKG_NAME has no live release yet; publish its first version with a live tag." >&2
            exit 1
          fi
          if [ -n "$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null)" ]; then
            echo "$PKG_NAME@$PKG_VERSION is already released; bump the version in package.json for a new beta." >&2
            exit 1
          fi

      - name: Set the beta version
        if: steps.resolve.outputs.npm_tag == 'beta'
        working-directory: ${{ steps.resolve.outputs.pkg_path }}
        env:
          PUBLISH_VERSION: ${{ steps.resolve.outputs.publish_version }}
        run: npm pkg set version="$PUBLISH_VERSION"

      - name: Pack package
        working-directory: ${{ steps.resolve.outputs.pkg_path }}
        run: npm pack --json

      - name: Publish package
        working-directory: ${{ steps.resolve.outputs.pkg_path }}
        # Betas publish under `beta` and other prereleases under `next`, so they never become the default install.
        run: npm publish --access public --tag "${{ steps.resolve.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
