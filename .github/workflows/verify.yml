name: Verify

on:
  push:
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # SET-186: packs @subset.dev/links and @subset.dev/link-capture as the tag workflow would (npm pack --dry-run and
      # npm pack), installs the tarballs outside the repository and imports them on Node, and links in workerd.
      - run: npm run test:packed
      # SET-174's opt-in scale check: a 50,000-item import on SQLite within 120 s, alone so nothing competes with it.
      - run: npm run test:scale --workspace=@subset.dev/bookmarks-core
        env:
          BOOKMARKS_IMPORT_SCALE: '1'
        timeout-minutes: 10
      # The CLI tests run the built dist/cli.mjs, so they follow the build.
      - run: npm test --workspace=@subset.dev/minutes
      - run: npm test --workspace=@subset.dev/usage-core
      # The usage CLI tests, including the MCP server over stdio (SET-104), run the source and the built dist/cli.mjs
      # against temp data directories.
      - run: npm test --workspace=@subset.dev/usage
      # The Timer daemon and CLI tests run against a real Unix socket, use the built @subset.dev/timer-core and
      # rebuild dist/cli.mjs for the packaging checks.
      - run: npm test --workspace=@subset.dev/timer
        timeout-minutes: 10

  # Builds the Breaks menu bar app and runs its unit tests. Only the macOS scheme: the runner image has no
  # matching iOS Simulator runtime, so the iOS targets are left out on purpose. No secrets and no signing.
  # Runs for pull requests and pushes to dev and main, not for every branch push, to save macOS runner minutes.
  breaks-macos:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "No Xcode 26 on this runner." >&2; exit 1; fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build and test BreaksMac
        run: >-
          xcodebuild -project native/breaks/Breaks.xcodeproj -scheme BreaksMac -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO test

  # SET-229: the subset.dev launcher's tests on macOS, where `subset list` detects installed apps with the real
  # /usr/bin/plutil (the workspace job runs the same tests on Linux with a plutil stand-in). The tests serve the
  # catalog fixtures from file: URLs and use temporary folders for the Applications folders. SET-230: the tests also
  # refuse an ad-hoc signed app with the real hdiutil, codesign and spctl, and a step installs the real Breaks 0.1.0
  # into a temporary folder. SET-231: the last step installs it again and uninstalls it into a test Trash. No
  # secrets. Runs for pull requests and pushes to dev and main, like breaks-macos.
  subset-dev-macos:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      # The tests compare the launcher's feed validation with the generator's Ajv validation, so they need the
      # workspace's dependencies; no install script is needed for that.
      - run: npm ci --ignore-scripts
      # The real-tool tests run only where the tools exist; fail rather than skip them here.
      - run: test -x /usr/bin/plutil && test -x /usr/bin/hdiutil && test -x /usr/bin/codesign && test -x /usr/sbin/spctl && test -x /usr/bin/ditto
      - run: npm test --workspace=subset.dev
      # SET-230: installs the immutable Breaks 0.1.0 release asset (the fixture feed's live channel and SHA-256) with
      # the real hdiutil, codesign and spctl into a temporary folder, the one download these checks make, and checks
      # the installed app again. Empty stand-ins for the Applications folders keep the runner's own apps out of it.
      - name: subset install breaks with the real tools
        env:
          SUBSET_CATALOG_URL: file://${{ github.workspace }}/packages/catalog/feed/fixtures/catalog-valid-live-only.json
        run: |
          root="$RUNNER_TEMP/subset-install"
          mkdir -p "$root/apps" "$root/home" "$root/Applications" "$root/user-Applications"
          HOME="$root/home" SUBSET_APPLICATIONS_DIRS="$root/Applications:$root/user-Applications" \
            node packages/subset-dev/src/cli.mjs install breaks --dir "$root/apps"
          test "$(ls -A "$root/apps")" = "Breaks.app"
          codesign --verify --deep --strict --verbose=2 "$root/apps/Breaks.app"
          spctl --assess --type execute --verbose=2 "$root/apps/Breaks.app"
          # The downloaded image is detached.
          if hdiutil info | grep -F "/subset-install-"; then echo "the downloaded image is still attached" >&2; exit 1; fi
      # SET-231: installs Breaks 0.1.0 the same way into the /Applications stand-in, so that it gets a receipt, then
      # subset uninstall (with the real ps) moves it to a test Trash folder and deletes the receipt.
      - name: subset uninstall breaks with the real tools
        env:
          SUBSET_CATALOG_URL: file://${{ github.workspace }}/packages/catalog/feed/fixtures/catalog-valid-live-only.json
        run: |
          root="$RUNNER_TEMP/subset-uninstall"
          mkdir -p "$root/home" "$root/Applications" "$root/user-Applications" "$root/Trash"
          export HOME="$root/home" SUBSET_APPLICATIONS_DIRS="$root/Applications:$root/user-Applications" SUBSET_TRASH_DIR="$root/Trash"
          receipt="$root/home/Library/Application Support/Subset/receipts/dev.subset.breaks.json"
          node packages/subset-dev/src/cli.mjs install breaks --dir "$root/Applications"
          test -f "$receipt"
          node packages/subset-dev/src/cli.mjs uninstall breaks
          test -z "$(ls -A "$root/Applications")"
          test ! -e "$receipt"
          trashed="$(ls -A "$root/Trash")"
          echo "$trashed" | grep -Ex 'Breaks [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}\.[0-9]{2}\.[0-9]{2}\.app'
          codesign --verify --deep --strict "$root/Trash/$trashed"
