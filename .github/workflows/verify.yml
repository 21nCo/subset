name: Verify

on:
  push:
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The CLI tests run the built dist/cli.mjs, so they follow the build.
      - run: npm test --workspace=@subset.dev/minutes
