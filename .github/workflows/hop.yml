name: Hop macOS

# Builds and tests the Hop native app on macOS, checks that its Debug and Release builds are separate apps, and fails
# if it links a private macOS API. No signing credentials are available or needed here: the app is built unsigned
# (CODE_SIGNING_ALLOWED=NO overrides the Debug configuration's team signing, and a Debug build with signing left on
# comes out unsigned because this runner has no Apple Development certificate), and releases go through
# release-macos.yml.
on:
  pull_request:
    paths:
      - 'native/hop/**'
      - '.github/workflows/hop.yml'
  push:
    branches: [dev, main]
    paths:
      - 'native/hop/**'
      - '.github/workflows/hop.yml'

permissions:
  contents: read

concurrency:
  group: hop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/hop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "No Xcode 26 on this runner." >&2; exit 1; fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Package tests
        run: swift test

      - name: Private-symbol check tests
        run: sh Tests/private-symbols.sh

      - name: Generated project is current
        run: |
          gem install --user-install xcodeproj -v 1.27.0
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          ruby ProjectGenerator.rb
          git diff --exit-code -- Hop.xcodeproj
          test -z "$(git status --porcelain -- Hop.xcodeproj)"
          sh Tests/project-generator.sh

      - name: Build and test the Xcode project (unsigned)
        run: |
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= build test

      - name: Build the Release configuration (unsigned)
        run: |
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= build

      - name: Debug and Release are separate apps
        run: |
          products="$RUNNER_TEMP/derived/Build/Products"
          sh Tests/app-identity.sh --debug-app "$products/Debug/Hop.app" --release-app "$products/Release/Hop.app"

      - name: Debug build without a development certificate is unsigned
        run: |
          xcodebuild -project Hop.xcodeproj -scheme Hop -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/signing" build
          sh Tests/development-signing.sh --debug-app "$RUNNER_TEMP/signing/Build/Products/Debug/Hop.app"

      - name: No private API symbols
        run: |
          products="$RUNNER_TEMP/derived/Build/Products/Debug"
          sh scripts/check-private-symbols.sh "$products/Hop.app" "$products/libHopCore.a"
