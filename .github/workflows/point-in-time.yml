name: pointInTime macOS

# Builds and tests the pointInTime native app on macOS. No signing credentials are available or needed here: the
# app is built unsigned, and releases go through release-macos.yml.
on:
  pull_request:
    paths:
      - 'native/point-in-time/**'
      - '.github/workflows/point-in-time.yml'
  push:
    branches: [main]
    paths:
      - 'native/point-in-time/**'
      - '.github/workflows/point-in-time.yml'

permissions:
  contents: read

concurrency:
  group: point-in-time-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-26
    defaults:
      run:
        working-directory: native/point-in-time
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "No Xcode 26 on this runner." >&2; exit 1; fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Package tests
        run: swift test

      - name: Generated project is current
        run: |
          gem install --user-install xcodeproj -v 1.27.0
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          ruby ProjectGenerator.rb
          git diff --exit-code -- PointInTime.xcodeproj

      - name: Build and test the Xcode project (unsigned)
        run: |
          xcodebuild -project PointInTime.xcodeproj -scheme PointInTime -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= build test
