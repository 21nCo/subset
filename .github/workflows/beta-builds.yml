name: Beta builds
run-name: Beta builds${{ inputs.issue && format(' for {0}', inputs.issue) || '' }}${{ inputs.request && format(' [{0}]', inputs.request) || '' }}

# Builds betas for acceptance testing, on request rather than on every merge: when a parent issue's implementation
# is merged into dev, the Linear loop (thyaravind/automations, beta-handoff.mjs) starts this workflow for that
# issue's apps and packages, then sends the owner the download and what to verify. It can also be run by hand.
#   macOS apps    tag macos/<app-id>/v<x.y.z>-beta.<n> and run release-macos.yml: a signed, notarized GitHub
#                 pre-release that the app's dev landing page offers for download
#   npm packages  tag <slug>-v<x.y.z>-beta.<n> and run publish-tag.yml: published under the npm `beta` dist-tag
# scripts/beta-builds.mjs decides what to build. Targets named in `only` are built even if unchanged, unless
# `skip_unchanged` is set; without `only`, every target whose inputs changed since its last build is built. A target whose version is already
# released live is skipped (bump it to get betas again).
#
# Tags pushed with the workflow token start no workflows, so this job starts each build itself; a run started
# from a tag passes the macos-release environment's tag policy. If starting a build fails after its tag was made,
# re-run the failed job: it reuses the tag and starts the build again.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Build just these targets, even if unchanged (space-separated, e.g. "macos/breaks npm/usage"); empty builds every changed target'
        required: false
        type: string
      skip_unchanged:
        description: 'Skip targets in `only` that are unchanged since their last build (their newest beta is still current)'
        required: false
        type: boolean
        default: false
      issue:
        description: 'Linear issue these betas are for (e.g. SET-24), shown in the run name'
        required: false
        type: string
      request:
        description: 'Request ID from the caller, shown in the run name so it can find this run'
        required: false
        type: string

permissions:
  contents: read

# One plan at a time, so two runs never pick the same build number. GitHub keeps one pending run per group and a
# newer one replaces it; the replaced run's caller sees it cancelled and starts it again with a new request ID
# (beta-handoff.mjs does this).
concurrency:
  group: beta-builds
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads earlier runs, to refuse a request ID that was already used.
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout dev with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check the run labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          REQUEST: ${{ inputs.request }}
        run: |
          if [ -n "$ISSUE" ] && ! [[ "$ISSUE" =~ ^[A-Z][A-Z0-9]*-[1-9][0-9]*$ ]]; then echo "issue must look like SET-24" >&2; exit 1; fi
          if [ -n "$REQUEST" ] && ! [[ "$REQUEST" =~ ^[A-Za-z0-9._-]{1,80}$ ]]; then echo "request must be 1-80 letters, digits, dots, dashes or underscores" >&2; exit 1; fi
          # A request is built once: a caller that sends the same request again (for example after an unclear
          # response) gets this failure instead of a second set of betas. A re-run of this run keeps its ID.
          if [ -n "$REQUEST" ]; then
            earlier="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow beta-builds.yml --limit 200 --json databaseId,displayTitle \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.displayTitle | endswith(\"[$REQUEST]\")))] | first | .databaseId // empty")"
            if [ -n "$earlier" ]; then echo "Request $REQUEST was already made by run $earlier." >&2; exit 1; fi
          fi

      - name: Plan beta builds
        id: plan
        env:
          # Read-only lookups of earlier betas' releases (--skip-unchanged).
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          SKIP_UNCHANGED: ${{ inputs.skip_unchanged }}
        run: |
          if [ "$SKIP_UNCHANGED" = true ]; then
            node scripts/beta-builds.mjs --only "$ONLY" --skip-unchanged
          else
            node scripts/beta-builds.mjs --only "$ONLY"
          fi

  start:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).builds[0] != null
    runs-on: ubuntu-latest
    # Runs no repository code: it only creates the planned tags and starts the release workflows from them.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Tag and start each build
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          echo "$PLAN" | jq -r '.builds[] | "\(.kind) \(.tag)"' | while read -r kind tag; do
            case "$kind" in
              macos) workflow=release-macos.yml; pattern='^macos/[a-z0-9][a-z0-9-]*/v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$' ;;
              npm) workflow=publish-tag.yml; pattern='^[a-z0-9][a-z0-9-]*-v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$' ;;
              *) echo "Unknown build kind $kind" >&2; exit 1 ;;
            esac
            if ! [[ "$tag" =~ $pattern ]]; then echo "Refusing unexpected tag $tag" >&2; exit 1; fi
            # A rerun after a failure finds its own tags already made: if creating the tag fails, it must already be on
            # this commit (a tag on any other commit, or a failed lookup, stops the job).
            # The create error is kept in the log; commits/<tag> resolves lightweight and annotated tags to their commit.
            if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null; then
              existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
              if [ "$existing" != "$GITHUB_SHA" ]; then
                echo "Could not create tag $tag; it is on ${existing:-an unknown commit}, not $GITHUB_SHA." >&2
                exit 1
              fi
              # On a re-run, a build an earlier attempt already started is left alone.
              started="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$tag" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [ -n "$started" ]; then
                echo "$workflow for $tag was already started (run $started)" | tee -a "$GITHUB_STEP_SUMMARY"
                continue
              fi
            fi
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$tag" -f release_tag="$tag"
            echo "Started $workflow for $tag at $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          done
