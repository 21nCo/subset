name: Beta builds
run-name: Beta builds${{ inputs.issue && format(' for {0}', inputs.issue) || '' }}${{ inputs.request && format(' [{0}]', inputs.request) || '' }}

# Plans betas for acceptance testing, on request rather than on every merge: when a parent issue's implementation
# is merged into dev, the Linear loop (thyaravind/automations, beta-handoff.mjs) starts this workflow for that
# issue's apps and packages, then builds what it planned and sends the owner the download and what to verify.
#   macOS apps    tag macos/<app-id>/v<x.y.z>-beta.<n>, then release-macos.yml: a signed, notarized GitHub
#                 pre-release that the app's dev landing page offers for download
#   npm packages  tag <slug>-v<x.y.z>-beta.<n>, then publish-tag.yml: published under the npm `beta` dist-tag
# This workflow only plans: it uploads the plan as the `beta-plan` artifact (plan.json, with the commit the tags go
# on). Only organization admins may create beta tags (a tag ruleset), so the handoff, which runs as an organization
# admin, creates each planned tag on that commit and starts its release workflow. A run started by hand plans the same
# way and builds nothing; an organization admin can build its plan by pushing the planned tags on the run's commit.
# scripts/beta-builds.mjs decides what to build. Targets named in `only` are built even if unchanged, unless
# `skip_unchanged` is set; without `only`, every target whose inputs changed since its last build is built. A target whose version is already
# released live is skipped (bump it to get betas again).
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Build just these targets, even if unchanged (space-separated, e.g. "macos/breaks npm/usage"); empty builds every changed target'
        required: false
        type: string
      skip_unchanged:
        description: 'Skip targets in `only` that are unchanged since their last build (their newest beta is still current)'
        required: false
        type: boolean
        default: false
      issue:
        description: 'Linear issue these betas are for (e.g. SET-24), shown in the run name'
        required: false
        type: string
      request:
        description: 'Request ID from the caller, shown in the run name so it can find this run'
        required: false
        type: string

permissions:
  contents: read

# One plan at a time. Two plans made before the first one's tags exist can still pick the same build number; the
# handoff then finds the tag already made and keeps it only if it is on its own run's commit. GitHub keeps one pending run per group and a
# newer one replaces it; the replaced run's caller sees it cancelled and starts it again with a new request ID
# (beta-handoff.mjs does this).
concurrency:
  group: beta-builds
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads earlier runs, to refuse a request ID that was already used.
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout dev with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check the run labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          REQUEST: ${{ inputs.request }}
        run: |
          if [ -n "$ISSUE" ] && ! [[ "$ISSUE" =~ ^[A-Z][A-Z0-9]*-[1-9][0-9]*$ ]]; then echo "issue must look like SET-24" >&2; exit 1; fi
          if [ -n "$REQUEST" ] && ! [[ "$REQUEST" =~ ^[A-Za-z0-9._-]{1,80}$ ]]; then echo "request must be 1-80 letters, digits, dots, dashes or underscores" >&2; exit 1; fi
          # A request is built once: a caller that sends the same request again (for example after an unclear
          # response) gets this failure instead of a second set of betas. A re-run of this run keeps its ID.
          if [ -n "$REQUEST" ]; then
            earlier="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow beta-builds.yml --limit 200 --json databaseId,displayTitle \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.displayTitle | endswith(\"[$REQUEST]\")))] | first | .databaseId // empty")"
            if [ -n "$earlier" ]; then echo "Request $REQUEST was already made by run $earlier." >&2; exit 1; fi
          fi

      - name: Plan beta builds
        id: plan
        env:
          # Read-only lookups of earlier betas' releases (--skip-unchanged).
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          SKIP_UNCHANGED: ${{ inputs.skip_unchanged }}
        run: |
          if [ "$SKIP_UNCHANGED" = true ]; then
            node scripts/beta-builds.mjs --only "$ONLY" --skip-unchanged
          else
            node scripts/beta-builds.mjs --only "$ONLY"
          fi

      - name: Save the plan for the handoff
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          mkdir -p "$RUNNER_TEMP/beta-plan"
          jq --arg commit "$GITHUB_SHA" '{commit: $commit} + .' <<<"$PLAN" > "$RUNNER_TEMP/beta-plan/plan.json"
          {
            echo '### Beta plan'
            echo
            echo "Tags go on \`$GITHUB_SHA\`:"
            jq -r '.builds[] | "- \(.tag) (\(.name))"' "$RUNNER_TEMP/beta-plan/plan.json"
            jq -r '.skipped[] | "- skipped \(.name): \(.reason)"' "$RUNNER_TEMP/beta-plan/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-plan
          path: ${{ runner.temp }}/beta-plan/plan.json
          if-no-files-found: error
          # A re-run replaces the first attempt's plan.
          overwrite: true
          retention-days: 7
