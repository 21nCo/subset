name: Release macOS app

# Push a tag like macos/breaks/v0.1.0 (app id from native/<id>/macos-release.json, version matching the
# app's MARKETING_VERSION) to build a Developer ID-signed, notarized, stapled DMG and zip. The result goes to
# a DRAFT GitHub Release: nothing is public until someone verifies the download and publishes the draft.
#
# A dev build tag like macos/breaks/v0.1.1-dev.3 builds the same way, with files named <App>-0.1.1-dev.3 and
# CFBundleVersion 3, and publishes them as a GitHub PRE-RELEASE (not a draft, never "latest") so testers can
# download it. A dev build is for testing and is never listed as available in the catalog.
#
# Needs these secrets in the `macos-release` environment:
#   MACOS_CERTIFICATE_P12       base64 of the "Developer ID Application" certificate and private key (.p12)
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_API_KEY_P8            contents of an App Store Connect API key (AuthKey_<id>.p8) with Developer access
#   APPLE_API_KEY_ID            that key's ID
#   APPLE_API_ISSUER            the App Store Connect issuer ID
#   APPLE_TEAM_ID               the Apple team ID the certificate belongs to
on:
  push:
    tags:
      - 'macos/*/v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in the form macos/<app-id>/v<version> or macos/<app-id>/v<version>-dev.<n>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Builds or fetches what an app's Xcode build needs but the repository doesn't hold (npm workspaces it bundles,
  # files its prepare script downloads). That runs dependency code, so this job has no environment, no secrets,
  # and a read-only token; the signing job only receives the declared outputs.
  prepare:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check the release tag
        run: |
          case "$RELEASE_TAG" in
            macos/*/v*.*.*) ;;
            *) echo "Release tag must look like macos/<app-id>/v<x.y.z> or macos/<app-id>/v<x.y.z>-dev.<n>." >&2; exit 1 ;;
          esac

      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Prepare build inputs
        run: |
          app_id="$(node --input-type=module -e 'import { parseReleaseTag } from "./scripts/release-macos.mjs"; console.log(parseReleaseTag(process.env.RELEASE_TAG).appId);')"
          node scripts/release-macos.mjs "$app_id" --prepare-only --prepared-archive "$RUNNER_TEMP/prepared.tar.gz"

      - name: Hand prepared inputs to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-inputs
          path: ${{ runner.temp }}/prepared.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: prepare
    runs-on: macos-26
    environment: macos-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      # The environment's tag policy is checked against github.ref, so the code that runs with the signing
      # secrets must be that ref. A manual run must be dispatched from the tag it names.
      - name: Check the release tag
        run: |
          case "$RELEASE_TAG" in
            macos/*/v*.*.*) ;;
            *) echo "Release tag must look like macos/<app-id>/v<x.y.z> or macos/<app-id>/v<x.y.z>-dev.<n>." >&2; exit 1 ;;
          esac
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Run this workflow from tag $RELEASE_TAG (Use workflow from), not $GITHUB_REF." >&2
            exit 1
          fi

      # A manual run builds the requested tag, never the branch it was dispatched from.
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          # Later steps run code from the tag; they need no authenticated git, so keep the token out of git config.
          persist-credentials: false

      - name: Verify checkout matches the tag
        run: |
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
            echo "HEAD is not tag ${RELEASE_TAG} (${tag_commit})." >&2
            exit 1
          fi

      - name: Download prepared inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prepared-inputs
          path: ${{ runner.temp }}/prepared

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Resolve app and version
        id: tag
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { parseReleaseTag, releaseVersion } from "./scripts/release-macos.mjs";
            const { appId, version, dev } = parseReleaseTag(process.env.RELEASE_TAG);
            // dev is empty for a live release tag.
            appendFileSync(process.env.GITHUB_OUTPUT, `app_id=${appId}\nversion=${version}\ndev=${dev ?? ""}\nrelease_version=${releaseVersion(version, dev)}\n`);
          '

      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "No Xcode 26 on this runner." >&2; exit 1; fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_IMPORT_KEY: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_unlock="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_unlock" "$keychain"
          # No auto-lock: notarization can wait longer than an hour before the DMG is signed.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_unlock" "$keychain"
          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_IMPORT_KEY" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_unlock" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application' || {
            echo "The certificate secret holds no Developer ID Application identity." >&2
            exit 1
          }

      - name: Write notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, notarize, and staple
        id: build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Tag-derived values reach the shell through env vars, never through expression interpolation.
          APP_ID: ${{ steps.tag.outputs.app_id }}
          APP_VERSION: ${{ steps.tag.outputs.version }}
          DEV_BUILD: ${{ steps.tag.outputs.dev }}
        run: |
          dev_args=()
          if [ -n "$DEV_BUILD" ]; then dev_args=(--dev "$DEV_BUILD"); fi
          # --no-prepare: inputs were built without credentials in the prepare job; nothing here runs npm or fetches.
          # --prepared-from checks the archive's entries before unpacking it outside the checkout, then copies in
          # only the manifest's declared outputs.
          node scripts/release-macos.mjs "$APP_ID" --version "$APP_VERSION" "${dev_args[@]}" --no-prepare --prepared-from "$RUNNER_TEMP/prepared/prepared.tar.gz" --out "$RUNNER_TEMP/release"

      # A draft is visible only to repository collaborators. Publishing it, and linking it from the catalog or
      # a landing page, is a separate, manual step after the download has been checked on a clean Mac.
      - name: Create draft GitHub Release
        if: steps.tag.outputs.dev == ''
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.out_dir }}
          APP_NAME: ${{ steps.build.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$APP_NAME $VERSION for macOS" \
            --notes "Developer ID-signed and notarized build of $APP_NAME $VERSION. SHA-256 checksums are in SHA256SUMS." \
            "$OUT_DIR"/*.dmg "$OUT_DIR"/*.zip "$OUT_DIR"/SHA256SUMS

      # Dev builds are published as pre-releases so testers can download them without a GitHub account. A
      # pre-release is never marked latest, and the catalog check rejects any dev build listed as available.
      - name: Create dev build pre-release
        if: steps.tag.outputs.dev != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.out_dir }}
          APP_NAME: ${{ steps.build.outputs.app }}
          VERSION: ${{ steps.tag.outputs.release_version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --latest=false \
            --verify-tag \
            --title "$APP_NAME $VERSION (dev build)" \
            --notes "Development build of $APP_NAME $VERSION for testing. This is not a release: it is not listed in the Subset catalog and may change or be removed. It is Developer ID-signed and notarized; SHA-256 checksums are in SHA256SUMS." \
            "$OUT_DIR"/*.dmg "$OUT_DIR"/*.zip "$OUT_DIR"/SHA256SUMS

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12"
